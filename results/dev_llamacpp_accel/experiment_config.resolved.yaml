    ttft_p95_cv: 0.1
    tpot_p95_cv: 0.1
    e2e_p99_cv: 0.15
    cpu_util_cv: 0.05
    peak_rss_cv: 0.03
    outlier_std: 2.0
    outlier_frac: 0.07
