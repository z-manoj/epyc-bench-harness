# Benchmark servers that are already running. The harness only needs an address:
# it does not launch, pin, or stop the process. engine and accel are labels
# (llama.cpp or vLLM, ZenDNN on or off) used by the client and the speedup report.
#
# Start each server yourself, then point a block at it. Pair a ZenDNN server with
# its CPU baseline via the same accel_group. Set slots_per_instance to the server's
# max concurrency (-np / --max-num-seqs) so concurrency: max is correct.
# Declare instances.cores only when this machine should attribute those cores;
# without them, server-core gates and pinning checks are skipped.
experiment_id: attach_endpoints
results_dir: /tmp/bench_attach_results
dataset_dir: ../prompts
dev_mode: true

platform:
  harness_cores: [0, 1]
  expected_smt: null
  expected_governor: null
  require_numactl: false

run_policy:
  reps: 3
  stability_window_s: 5
  stability_max_retries: 2
  cooldown_s: 3
  server_ready_timeout_s: 30
  request_timeout_s: 300
  system_check_window_s: 3

warmup:
  server_warmup_requests: 2
  per_rep_warmup_requests: 1
  per_rep_warmup_min_s: 0

thresholds:
  system_check: {max_mean_util_pct: 100, max_foreign_proc_cpu_pct: 1000}
  gate: {max_other_util_mean_pct: 100, max_sys_mem_drift_mb: 4096, max_freq_dev_frac: 0.25}
  validation: {max_outside_util_pct: 100}

server_configs:
  - id: llamacpp_zendnn
    mode: attach
    engine: llamacpp
    accel: zendnn
    accel_group: llamacpp_q8
    model: Meta-Llama-3.1-8B-Instruct
    precision: q8_0
    host: 127.0.0.1
    port: 8080
    slots_per_instance: 4

  - id: llamacpp_cpu
    mode: attach
    engine: llamacpp
    accel: none
    accel_group: llamacpp_q8
    model: Meta-Llama-3.1-8B-Instruct
    precision: q8_0
    host: 127.0.0.1
    port: 8081
    slots_per_instance: 4

  - id: vllm_zentorch
    mode: attach
    engine: vllm
    accel: zendnn
    accel_group: vllm_bf16
    model: meta-llama/Meta-Llama-3.1-8B-Instruct
    precision: bf16
    host: 127.0.0.1
    port: 8000
    slots_per_instance: 16

  - id: vllm_cpu
    mode: attach
    engine: vllm
    accel: none
    accel_group: vllm_bf16
    model: meta-llama/Meta-Llama-3.1-8B-Instruct
    precision: bf16
    host: 127.0.0.1
    port: 8001
    slots_per_instance: 16

workloads:
  - {scenario: online_single, prompt_sizes: [128], output_lens: [32], concurrency: [1], num_requests: 6}
  - {scenario: online_multi, prompt_sizes: [128], output_lens: [32], concurrency: [4], num_requests: 8}
